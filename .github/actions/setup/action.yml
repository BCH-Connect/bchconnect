name: Setup
description: Install pnpm, Node.js and the workspace dependencies.
inputs:
  cache:
    description: Whether to cache the pnpm store. Jobs that can write to the repository or publish turn it off.
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: ${{ inputs.cache }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - run: pnpm install --frozen-lockfile
      shell: bash
