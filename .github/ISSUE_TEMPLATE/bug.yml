name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: "@bchconnect/core"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: input
    id: protocol
    attributes:
      label: Protocol
  - type: input
    id: wallet
    attributes:
      label: Wallet and version
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or a link to a repository.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
