name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm palette:check

  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit
      - run: pnpm test:stories

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: publint and arethetypeswrong
        run: |
          for dir in packages/*/; do
            [ -f "${dir}package.json" ] || continue
            [ "$(jq -r '.private // false' "${dir}package.json")" = "true" ] && continue
            tgz="$RUNNER_TEMP/package.tgz"
            (cd "$dir" && pnpm pack --out "$tgz")
            pnpm exec publint run "$tgz" --strict
            # A package without a require condition is ESM-only on purpose.
            profile=()
            [ "$(jq -r '.exports["."].require // empty' "${dir}package.json")" ] || profile=(--profile esm-only)
            pnpm exec attw "$tgz" "${profile[@]}"
          done
      - name: size-limit
        run: |
          for dir in packages/*/; do
            [ -f "${dir}.size-limit.json" ] || continue
            (cd "$dir" && pnpm exec size-limit)
          done
      - name: API Extractor
        run: |
          for dir in packages/*/; do
            [ -f "${dir}api-extractor.json" ] || continue
            (cd "$dir" && pnpm exec api-extractor run)
          done

  changeset:
    # The release PR that changesets/action opens consumes the changesets, so
    # it never carries one. Matching the bot author keeps the branch name alone
    # from skipping the check.
    if: >-
      github.event_name == 'pull_request' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        startsWith(github.head_ref, 'changeset-release/')) &&
      !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm changeset status --since=origin/main
