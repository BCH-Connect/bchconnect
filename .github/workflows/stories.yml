name: Stories

on:
  pull_request:
    paths:
      - packages/ui/**
      - vitest.config.ts
      - package.json
      - pnpm-lock.yaml
      - .github/actions/setup/**
      - .github/workflows/stories.yml
  push:
    branches: [main]
    paths:
      - packages/ui/**
      - vitest.config.ts
      - package.json
      - pnpm-lock.yaml
      - .github/actions/setup/**
      - .github/workflows/stories.yml

permissions:
  contents: read

concurrency:
  group: stories-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium firefox webkit
      - run: pnpm test:stories
